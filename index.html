<style>
:root {
  --bordeaux: #812b45;
  --rose: #c65377;
  --rose-clair: #db7895;
  --peche: #ffb18d;
  --creme: #ffe2c1;
  --turquoise: #278f8d;
  --vert: #236c65;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 35px 20px 65px;
  background: var(--bordeaux);
  color: var(--peche);
  font-family: "DM Sans", sans-serif;
  text-align: center;
  overflow-x: hidden;
}

/* CONTENU */

.calendar-wrapper {
  position: relative;
  z-index: 1;
  width: min(100%, 1100px);
  margin: 0 auto;
}

h1 {
  margin: 18px 0 12px;
  color: var(--peche);
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(2.8rem, 7vw, 5rem);
  font-weight: 900;
  line-height: 0.98;
  letter-spacing: -2px;
}

.year {
  display: inline-block;
  margin-top: 14px;
  color: var(--creme);
  font-family: "Fraunces", Georgia, serif;
  font-size: 1.4rem;
  letter-spacing: 5px;
}

.subtitle {
  margin: 15px 0 48px;
  color: var(--creme);
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(1rem, 2.5vw, 1.3rem);
  font-style: italic;
}

/* GRILLE */

.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 25px 18px;
  width: 100%;
  max-width: 1030px;
  margin: 0 auto;
}

/* CASES */

.day {
  --blob-color: var(--rose);

  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 155px;
  padding: 15px;
  border: 0;
  background: transparent;
  color: var(--creme);
  font-family: "Fraunces", Georgia, serif;
  font-size: 2.6rem;
  font-weight: 900;
  cursor: pointer;
  isolation: isolate;
  transition: transform 0.3s ease;
  -webkit-tap-highlight-color: transparent;
}

/* MÉDAILLONS IRRÉGULIERS */

.day::before {
  content: "";
  position: absolute;
  inset: 7px;
  z-index: -1;
  background: var(--blob-color);
  border-radius: 41% 48% 39% 45% / 46% 39% 49% 42%;
  transform: rotate(-5deg);
  box-shadow: 0 6px 0 rgba(70, 13, 34, 0.16);
  transition: transform 0.3s, background 0.3s;
}

.day:nth-child(2n)::before {
  border-radius: 47% 38% 46% 40% / 39% 48% 41% 47%;
  transform: rotate(5deg);
}

.day:nth-child(3n)::before {
  border-radius: 38% 47% 43% 49% / 49% 40% 46% 38%;
  transform: rotate(-8deg);
}

.day.green {
  --blob-color: #c65377;
}

.day.red {
  --blob-color: #b9496d;
}

.day.brown {
  --blob-color: #d16b85;
}

.day.gold {
  --blob-color: #c85c7c;
}

.day.cream {
  --blob-color: #d87591;
}

.day:hover {
  transform: translateY(-5px) scale(1.04);
}

.day:hover::before {
  background: var(--rose-clair);
  transform: rotate(0deg) scale(1.05);
}

.day:focus-visible {
  outline: 3px solid var(--creme);
  outline-offset: 3px;
  border-radius: 30px;
}

.day-number {
  position: relative;
  z-index: 3;
  transform: translate(-13px, -8px);
  text-shadow: 0 2px 2px rgba(95, 25, 47, 0.16);
}

/* ILLUSTRATIONS TRANSPARENTES */

.illustration {
  position: absolute;
  right: -6px;
  bottom: -5px;
  z-index: 2;
  width: 91px;
  height: 91px;
  background: transparent;
  pointer-events: none;
}

.illustration svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
  background: transparent;
}

/* MARQUAGE DES CASES VISITÉES */

.day.opened:not(.locked)::after {
  content: "✓";
  position: absolute;
  top: 15px;
  right: 22px;
  z-index: 4;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--turquoise);
  color: white;
  font-family: sans-serif;
  font-size: 13px;
}

.day.opened:not(.locked)::before {
  filter: saturate(0.8);
}


/* CASES VERROUILLÉES JUSQU'À LEUR DATE */
.day.locked {
  cursor: not-allowed;
  opacity: 0.62;
}

.day.locked:hover {
  transform: none;
}

.day.locked:hover::before {
  background: var(--blob-color);
  transform: rotate(-5deg);
}

.lock-icon {
  position: absolute;
  top: 13px;
  right: 19px;
  z-index: 4;
  font-family: sans-serif;
  font-size: 18px;
  line-height: 1;
}

.day:not(.locked) .lock-icon {
  display: none;
}

/* DÉCORATIONS DES COINS */

.corner {
  position: absolute;
  z-index: 0;
  width: clamp(110px, 18vw, 230px);
  height: auto;
  pointer-events: none;
}

.corner svg {
  display: block;
  width: 100%;
  height: auto;
}

.corner.top-left {
  top: 0;
  left: 0;
}

.corner.top-right {
  top: 0;
  right: 0;
  transform: scaleX(-1);
}

.corner.bottom-left {
  bottom: 0;
  left: 0;
  transform: scaleY(-1);
}

.corner.bottom-right {
  bottom: 0;
  right: 0;
  transform: scale(-1);
}

/* PETITES ÉTOILES DÉCORATIVES */

.sparkle {
  position: absolute;
  color: var(--peche);
  opacity: 0.85;
  pointer-events: none;
  font-size: 22px;
}

.sparkle.one {
  top: 180px;
  left: 8%;
}

.sparkle.two {
  top: 230px;
  right: 8%;
}

.sparkle.three {
  bottom: 70px;
  left: 12%;
}

.sparkle.four {
  bottom: 120px;
  right: 11%;
}

/* FLOCONS */

.snow {
  position: fixed;
  top: -15px;
  z-index: 5;
  pointer-events: none;
  color: var(--creme);
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
  }
}

/* TABLETTE */

@media (max-width: 850px) {
  .grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px 12px;
  }

  .day {
    min-height: 140px;
  }

  .illustration {
    width: 80px;
    height: 80px;
  }
}

/* MOBILE */

@media (max-width: 600px) {
  body {
    padding: 35px 12px 45px;
  }

  h1 {
    margin-top: 65px;
    letter-spacing: -1px;
  }

  .subtitle {
    margin-bottom: 30px;
  }

  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px 8px;
  }

  .day {
    min-height: 112px;
    padding: 8px;
    font-size: 2rem;
  }

  .day-number {
    transform: translate(-8px, -8px);
  }

  .illustration {
    width: 61px;
    height: 61px;
    right: -5px;
    bottom: -3px;
  }

  .day.opened:not(.locked)::after {
    top: 8px;
    right: 10px;
    width: 18px;
    height: 18px;
    font-size: 11px;
  }

  .corner {
    width: 115px;
  }

  .sparkle {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .day,
  .day::before {
    transition: none;
  }

  .snow {
    display: none;
  }
}
</style>

// ==========================================
// 5. OUVERTURE PROGRESSIVE EN DÉCEMBRE 2026
// ==========================================

const ANNEE_CALENDRIER = 2026;
const grid = document.getElementById("calendar");
const cases = new Map();

// La date est interprétée dans le fuseau horaire français.
function dateEnFrance() {
  const morceaux = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Paris",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const valeurs = Object.fromEntries(
    morceaux.filter(part => part.type !== "literal")
      .map(part => [part.type, Number(part.value)])
  );
  return valeurs.year * 10000 + valeurs.month * 100 + valeurs.day;
}

function caseAccessible(jour) {
  return dateEnFrance() >= ANNEE_CALENDRIER * 10000 + 1200 + jour;
}

function actualiserVerrous() {
  joursOuvres.forEach(jour => {
    const element = cases.get(jour);
    const verrouillee = !caseAccessible(jour);
    element.classList.toggle("locked", verrouillee);
    // Une ancienne visite ne doit jamais apparaître sur une case future.
    let dejaVisitee = false;
    try {
      dejaVisitee = localStorage.getItem("avent2026_" + jour) === "opened";
    } catch (error) {
      // Le calendrier fonctionne même si le stockage est désactivé.
    }
    element.classList.toggle("opened", !verrouillee && dejaVisitee);
    element.setAttribute("aria-label", verrouillee
      ? `Jour ${jour} : disponible le ${jour} décembre ${ANNEE_CALENDRIER}`
      : `Ouvrir le jour ${jour}`);
  });
}

joursOuvres.forEach((jour, index) => {
  const day = document.createElement("button");
  day.type = "button";
  day.className = "day " + themes[index];

  const number = document.createElement("span");
  number.className = "day-number";
  number.textContent = jour;

  const illustration = document.createElement("span");
  illustration.className = "illustration";
  illustration.setAttribute("aria-hidden", "true");
  illustration.innerHTML = illustrations[index % illustrations.length];

  const cadenas = document.createElement("span");
  cadenas.className = "lock-icon";
  cadenas.setAttribute("aria-hidden", "true");
  cadenas.textContent = "🔒";

  day.append(number, illustration, cadenas);

  day.addEventListener("click", () => {
    // Vérification au moment exact du clic, pas seulement au chargement.
    if (!caseAccessible(jour)) {
      alert(`Patience ! La case ${jour} s'ouvrira le ${jour} décembre ${ANNEE_CALENDRIER}.`);
      return;
    }

    const url = liens[jour];
    if (url) {
      window.open(url, "_blank", "noopener,noreferrer");
      day.classList.add("opened");
      try {
        localStorage.setItem("avent2026_" + jour, "opened");
      } catch (error) {
        // Le calendrier reste utilisable sans stockage local.
      }
    }
  });

  // L’état visité est restauré uniquement si la date est accessible,
  // par actualiserVerrous() après la création de toutes les cases.
  cases.set(jour, day);
  grid.appendChild(day);
});

actualiserVerrous();
// Mise à jour sans avoir besoin de recharger la page à minuit.
setInterval(actualiserVerrous, 30000);
window.addEventListener("focus", actualiserVerrous);
document.addEventListener("visibilitychange", actualiserVerrous);

// ==========================================
// 6. FLOCONS DE NEIGE
// ==========================================

function createSnowflake() {
  const snow = document.createElement("span");
  snow.className = "snow";
  snow.textContent = "❄";

  snow.style.left = Math.random() * 100 + "vw";
  snow.style.fontSize = (8 + Math.random() * 12) + "px";
  snow.style.opacity = (0.15 + Math.random() * 0.45);
  snow.style.animationDuration = (7 + Math.random() * 7) + "s";

  document.body.appendChild(snow);

  snow.addEventListener("animationend", () => {
    snow.remove();
  });
}

if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  setInterval(createSnowflake, 600);
}

</script>
